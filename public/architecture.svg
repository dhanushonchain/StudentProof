<text x="416" y="94" font-size="22" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="416" dy="0">StudentProof — Next.js app (Vercel)</tspan></text>
<rect x="900" y="60" width="380" height="840" rx="0" fill="transparent" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/>
<text x="916" y="94" font-size="22" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="916" dy="0">Core logic (lib/)</tspan></text>
<rect x="1340" y="60" width="400" height="840" rx="0" fill="transparent" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1356" y="94" font-size="22" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="1356" dy="0">External services &amp; chain</tspan></text>
<rect x="60" y="150" width="260" height="120" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" />
<text x="76" y="182" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="76" dy="0">Student (browser)</tspan></text>
<text x="76" y="208" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="76" dy="0">Signs in, verifies status,</tspan><tspan x="76" dy="17.5">receives credential</tspan></text>
<rect x="60" y="450" width="260" height="120" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" />
<text x="76" y="482" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="76" dy="0">Business / developer</tspan></text>
<text x="76" y="508" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="76" dy="0">Gets API key on /sdk,</tspan><tspan x="76" dy="17.5">calls /api/verify</tspan></text>
<rect x="60" y="750" width="260" height="120" rx="14" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2" />
<text x="76" y="782" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="76" dy="0">Third-party app backend</tspan></text>
<text x="76" y="808" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="76" dy="0">Verify API, token exchange,</tspan><tspan x="76" dy="17.5">JWKS signature check</tspan></text>
<rect x="420" y="150" width="400" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" />
<text x="436" y="182" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="436" dy="0">Pages</tspan></text>
<text x="436" y="208" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="436" dy="0">/  ·  /dashboard  ·  /sdk</tspan><tspan x="436" dy="17.5">/sdk/connect  ·  /sdk/authorize</tspan></text>
<rect x="420" y="300" width="400" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" />
<text x="436" y="332" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="436" dy="0">/api/auth/*  (Auth.js v5)</tspan></text>
<text x="436" y="358" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="436" dy="0">Google providers: student + business.</tspan><tspan x="436" dy="17.5">jwt callback creates user and wallet</tspan></text>
<rect x="420" y="450" width="400" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" />
<text x="436" y="482" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="436" dy="0">/api/verification/*</tspan></text>
<text x="436" y="508" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="436" dy="0">start · callback (webhook) · status · retry</tspan></text>
<rect x="420" y="600" width="400" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" />
<text x="436" y="632" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="436" dy="0">/api/sdk/*</tspan></text>
<text x="436" y="658" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="436" dy="0">authorize (consent) · token · jwks</tspan></text>
<rect x="420" y="750" width="400" height="120" rx="14" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2" />
<text x="436" y="782" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="436" dy="0">/api/verify  ·  /api/developer/*</tspan></text>
<text x="436" y="808" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="436" dy="0">API-key check · keys · OAuth clients</tspan></text>
<rect x="920" y="150" width="340" height="120" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" />
<text x="936" y="182" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="936" dy="0">Issuance orchestrator</tspan></text>
<text x="936" y="208" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="936" dy="0">atomic claim · chain reconcile</tspan><tspan x="936" dy="17.5">bounded retries (5)</tspan></text>
<rect x="920" y="300" width="340" height="120" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" />
<text x="936" y="332" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="936" dy="0">Proof verification</tspan></text>
<text x="936" y="358" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="936" dy="0">verifyProof against</tspan><tspan x="936" dy="17.5">the SAMARTH provider id</tspan></text>
<rect x="920" y="450" width="340" height="120" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" />
<text x="936" y="482" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="936" dy="0">Wallet derivation</tspan></text>
<text x="936" y="508" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="936" dy="0">key from Google sub +</tspan><tspan x="936" dy="17.5">server secret (no storage)</tspan></text>
<rect x="920" y="600" width="340" height="120" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" />
<text x="936" y="632" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="936" dy="0">SDK assertion signer</tspan></text>
<text x="936" y="658" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="936" dy="0">Ed25519 over v2 payload,</tspan><tspan x="936" dy="17.5">pairwise subject per client</tspan></text>
<rect x="920" y="750" width="340" height="120" rx="14" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" />
<text x="936" y="782" font-size="20" font-family="Georgia, serif" fill="#1e1e1e" xml:space="preserve"><tspan x="936" dy="0">Rate limiter</tspan></text>
<text x="936" y="808" font-size="14" font-family="Georgia, serif" fill="#495057" xml:space="preserve"><tspan x="936" dy="0">Valkey sliding window</tspan><tspan x="936" dy="17.5">per API key / client</tspan></text>
